[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelter-animal-outcomes"
version = "0.1.0"
description = "Multi-class classification of shelter animal outcomes"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.3,<3",
    "numpy>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "imbalanced-learn>=0.14,<0.15", 
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<0.14",
    "joblib>=1.5,<2",               
    "pyyaml>=6.0,<7",               
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "mypy>=2.3,<3",
    "pylint>=4.0,<5",
    "snakemake>=7.32,<8",
    "pulp<2.8",  # snakemake 7 calls the pre-2.8 PuLP API
]

[tool.setuptools]
# packages: declaring it explicitly is what makes 'from src import ...' work
# from any working directory once the project is installed with 'pip install -e .'
packages = ["src"]

[tool.mypy]
# sklearn, imblearn and joblib ship no type stubs: without this every import is
# an error.
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 100
# Ignore these lines from test coverage
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
# Ignore PendingDeprecationWarnings triggered internally by Seaborn
# in the EDA test suite.
filterwarnings = [
    "ignore::PendingDeprecationWarning:seaborn.*",
]
# Treat docstring examples as executable specifications: running them with the
# suite means an example can no longer drift away from the code it documents.
addopts = "--doctest-modules"

# "src" is listed next to "tests" because that is where the examples live,
# while "tests" remains the home of the proper test suite.
testpaths = ["tests", "src"]

# Doctests compare output character by character: normalising whitespace stops
# a printed DataFrame from failing over a shift in column alignment.
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

[tool.pylint.messages_control]
disable = [
    # X for a feature matrix and y for a target is the scikit-learn convention.
    "invalid-name",
    # A pytest test takes its fixture as a parameter of the same name.
    "redefined-outer-name",
    # fit(X, y) must accept y even when it learns nothing from it.
    "unused-argument",
    # The CLI entry points and the mock fixtures are alike by necessity.
    "duplicate-code",
    # A test class groups tests by the unit they cover, 
    # and some units need one
    "too-few-public-methods",
]
